name: Matrix Notification

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  # Teste manual da configuração (Actions → Matrix Notification → Run workflow).
  workflow_dispatch:

jobs:
  notify:
    # Avisa a sala Matrix da equipe (homeserver chat.adm.vps.imfxtech.com) quando
    # abre issue ou PR. Ignora PRs do Dependabot para não poluir a sala.
    # Não faz checkout: só lê dados do evento, por isso é seguro com
    # pull_request_target.
    if: ${{ github.event_name == 'issues' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send notification to Matrix room
        env:
          HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "${HOMESERVER}" ] || [ -z "${ACCESS_TOKEN}" ] || [ -z "${ROOM_ID}" ]; then
            echo "::warning title=Matrix Notification::Secrets MATRIX_HOMESERVER, MATRIX_ACCESS_TOKEN ou MATRIX_ROOM_ID não configurados; notificação pulada."
            exit 0
          fi
          HOMESERVER="${HOMESERVER%/}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            EMOJI="✅"
            PREFIX="Teste de notificação"
            TITLE="Configuração do Matrix Notification OK (disparado por ${GITHUB_ACTOR})"
            URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            LABELS=""
            AUTHOR="${GITHUB_ACTOR}"
          elif [ "${EVENT_NAME}" = "issues" ]; then
            EMOJI="📝"
            PREFIX="Nova issue"
            TITLE="${ISSUE_TITLE}"
            URL="${ISSUE_URL}"
            LABELS="${ISSUE_LABELS}"
            AUTHOR="${ISSUE_AUTHOR}"
          else
            EMOJI="🔀"
            PREFIX="Novo pull request"
            TITLE="${PR_TITLE}"
            URL="${PR_URL}"
            LABELS="${PR_LABELS}"
            AUTHOR="${PR_AUTHOR}"
          fi

          esc() { jq -rn --arg v "$1" '$v|@html'; }
          AUTHOR_URL="https://github.com/${AUTHOR}"
          PLAIN="${EMOJI} ${PREFIX} de ${AUTHOR} em ${GITHUB_REPOSITORY}: ${TITLE} - ${URL}"
          HTML="<h3>${EMOJI} ${PREFIX} em $(esc "${GITHUB_REPOSITORY}")</h3>"
          HTML="${HTML}<b><a href='$(esc "${URL}")'>$(esc "${TITLE}")</a></b><br/>"
          HTML="${HTML}👤 <a href='$(esc "${AUTHOR_URL}")'>$(esc "${AUTHOR}")</a>"
          if [ -n "${LABELS}" ]; then
            HTML="${HTML}<br/>🏷️ $(esc "${LABELS}")"
          fi
          TXN_ID="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ROOM_ENC=$(jq -rn --arg v "${ROOM_ID}" '$v|@uri')

          STATUS=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 -X PUT \
            "${HOMESERVER}/_matrix/client/v3/rooms/${ROOM_ENC}/send/m.room.message/${TXN_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$PLAIN" --arg html "$HTML" \
              '{"msgtype":"m.notice","body":$body,"format":"org.matrix.custom.html","formatted_body":$html}')") || true
          if [ "${STATUS}" != "200" ]; then
            echo "::error title=Matrix Notification::Homeserver respondeu HTTP ${STATUS}: $(jq -r '.errcode + " " + .error' response.json 2>/dev/null)"
            exit 1
          fi
          echo "Notificação enviada (HTTP ${STATUS})."
